<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131514">
<title>Tape Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--desk:#c2c6c2;--ink:#1d1f1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#131514;--ink:#e6e6e0}}
:root[data-theme="dark"]{--desk:#131514;--ink:#e6e6e0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Share Tech Mono","Courier New",monospace;display:flex;justify-content:center;padding:14px;min-height:100vh}
.app{--frame:#5b3d28;--p1:#585d5f;--p2:#383c3d;--k1:#d6d9d7;--k2:#9a9e9d;--ks:#44484a;--kc:#222;--ac:#d9822b;--fg:#e8e4d6;--lcd:#f0ecdc;--lcdbg:#0d0e0e;
width:100%;max-width:480px;display:grid;gap:14px;align-content:start;color:var(--fg)}
.app[data-th=cd]{--frame:#8f969c;--p1:#30353a;--p2:#16191c;--k1:#e6e9ec;--k2:#a9b0b6;--ks:#555b61;--kc:#1b1d1f;--ac:#3fb6ff;--fg:#dfe6ec;--lcd:#7fd3ff;--lcdbg:#051017}
.app[data-th=lp]{--frame:#3a2616;--p1:#80593a;--p2:#5c3c26;--k1:#f0e4c6;--k2:#c8b78e;--ks:#6a5636;--kc:#3a2a18;--ac:#e0a030;--fg:#f5ead0;--lcd:#ffc46b;--lcdbg:#1a1008}
.deck,.lib{border:10px solid var(--frame);border-radius:18px;padding:12px;min-width:0;box-shadow:0 18px 34px #0006,inset 0 0 0 2px #0003;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 3px),linear-gradient(var(--p1),var(--p2));transition:border-color .4s}
.lib{border-width:8px}
@media (min-width:600px){.app{max-width:640px}}
@media (min-width:1000px){
.app{max-width:1200px;grid-template-columns:minmax(400px,500px) minmax(0,1fr);align-items:start}
.lib{position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.lib ul{overflow:auto;min-height:0;flex:1}
.lib li{content-visibility:auto;contain-intrinsic-size:auto 52px}}
@media (min-width:1000px) and (min-height:940px){.deck{position:sticky;top:14px}}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:8px;background:#0003;color:var(--fg);font-size:14px}
.tabs button.on{background:var(--ac);color:#111}
.win{background:#0d0e0e;border:2px solid #0006;border-radius:10px;padding:6px}
svg{display:block;width:100%;height:auto}
.hw{font-family:"Special Elite","Courier New",monospace}
#mC,#mD{transform-origin:180px 115px}#mV{transform-origin:130px 115px}
#mC.out{animation:cOut .44s ease-in forwards}#mC.in{animation:cIn .52s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cOut{to{transform:translateY(150px) rotate(5deg);opacity:0}}
@keyframes cIn{from{transform:translateY(-140px) scale(.92);opacity:0}}
#mD.out{animation:dOut .44s ease-in forwards}#mD.in{animation:dIn .52s ease-out both}
@keyframes dOut{to{transform:translateX(170px) scale(.85);opacity:0}}
@keyframes dIn{from{transform:translateX(-170px) scale(.85);opacity:0}}
#mV.out{animation:vOut .44s ease-in forwards}#mV.in{animation:vIn .55s ease-out both}
@keyframes vOut{to{transform:translate(-60px,-50px) scale(1.12) rotate(-10deg);opacity:0}}
@keyframes vIn{from{transform:translate(0,-30px) scale(1.25);opacity:0}}
/* scrolling text */
.mq{overflow:hidden;white-space:nowrap}
.mq>em{display:inline-block;font-style:normal}
.mq.run>em,.mt.run{animation:mqx var(--t,8s) ease-in-out infinite alternate}
@keyframes mqx{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--d,0px))}}
.np{display:flex;flex-direction:column;align-items:center;margin:10px 0 0;min-height:44px;text-align:center}
.np b{display:block;max-width:100%;font-size:17px;font-weight:400}
.np small{font-size:13px;opacity:.75;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meters{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin:10px 0;align-items:center}
.vu{position:relative;height:60px;border-radius:6px;overflow:hidden;border:3px solid #0008;background:radial-gradient(circle at 50% 125%,#f3e6b4 0,#d8c685 75%);box-shadow:inset 0 0 12px #0006}
.vu i{position:absolute;left:50%;bottom:-6px;width:2px;height:52px;background:#b1281d;transform-origin:50% 100%;transform:rotate(-50deg)}
.vu b{position:absolute;left:7px;top:3px;font-size:12px;color:#3a2f12}
.vu::after{content:"";position:absolute;right:9px;top:11px;width:22px;height:4px;background:#b1281d;border-radius:2px;transform:rotate(38deg)}
.counter{background:var(--lcdbg);color:var(--lcd);font-size:26px;padding:8px 12px;border-radius:4px;border:2px solid #0008;letter-spacing:2px;text-shadow:0 0 7px var(--lcd)}
#seek{width:100%;margin:2px 0 12px;accent-color:var(--ac)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-bottom:5px}
.keys button{height:54px;border:0;border-radius:4px 4px 6px 6px;background:linear-gradient(var(--k1),var(--k2));color:var(--kc);font-size:15px;box-shadow:0 5px 0 var(--ks),0 7px 8px #0007;transition:transform .06s,box-shadow .06s;-webkit-user-select:none;user-select:none}
.keys button.on,.keys button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ks);filter:brightness(.88)}
.chips{display:flex;gap:6px;margin:10px 0}
.chips button{flex:1;padding:8px 4px;border:0;border-radius:99px;background:#0003;color:var(--fg);font-size:13px}
.chips button.on{background:var(--ac);color:#111}
.vol{display:flex;gap:10px;align-items:center;margin:6px 2px 2px;font-size:14px}
.vol input{flex:1;accent-color:var(--ac)}
/* library */
.lh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lh b{font-size:18px;font-weight:400}.lh small{opacity:.7;flex:1;font-size:13px}
.lh button{width:44px;height:38px;border:0;border-radius:6px;background:#0003;color:var(--fg);font-size:20px}
.lf{display:flex;gap:6px;margin-bottom:8px}
.lf input,.lf select{background:#0004;color:var(--fg);border:1px solid #fff3;border-radius:6px;padding:9px 10px;font:inherit;font-size:14px;min-width:0}
.lf input{flex:1}.lf option{color:#111}
.hint{font-size:13px;line-height:1.45;margin:6px 2px 10px;opacity:.9}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
li{display:flex;gap:6px}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--k1);color:var(--kc);border:0;border-left:6px solid var(--k2);border-radius:4px;padding:6px 10px 6px 6px;text-align:left}
.row.cur{border-left-color:var(--ac);filter:brightness(1.06)}
.th{width:40px;height:40px;border-radius:3px;flex:none;display:block;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 50) 60% 20%))}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th img:not([src]){display:none}
.row>span{display:flex;flex-direction:column;min-width:0;flex:1}
.row b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;font-size:15px}
.row b.mq{text-overflow:clip}
.row b em{font-style:normal}
.row small{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;border:0;border-radius:4px;background:#0003;color:var(--fg);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#000d;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>

<script id="codec">
/* ---------- ALAC / AIFF -> WAV (so the browser engine can play them) ---------- */
const r32=(u,p)=>((u[p]<<24)|(u[p+1]<<16)|(u[p+2]<<8)|u[p+3])>>>0,s4=(u,p)=>String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);
function kids(u,s,e){const o=[];let p=s;while(p+8<=e){let sz=r32(u,p),hd=8;if(sz===1){sz=r32(u,p+12);hd=16}else if(sz===0)sz=e-p;if(sz<hd)break;o.push({n:s4(u,p+4),s:p+hd,e:Math.min(p+sz,e)});p+=sz}return o}
function parseAlac(u){
for(const tr of kids(u,0,u.length)){if(tr.n!=='trak')continue;
const md=kids(u,tr.s,tr.e).find(k=>k.n==='mdia');if(!md)continue;
const mi=kids(u,md.s,md.e).find(k=>k.n==='minf');if(!mi)continue;
const st=kids(u,mi.s,mi.e).find(k=>k.n==='stbl');if(!st)continue;
const sk=kids(u,st.s,st.e),g=n=>sk.find(k=>k.n===n),sd=g('stsd');if(!sd)continue;
const en=kids(u,sd.s+8,sd.e)[0];if(!en||en.n!=='alac')continue;
const c=kids(u,en.s+28,en.e).find(k=>k.n==='alac');if(!c)continue;
const o=c.s+4,cfg={fl:r32(u,o),bd:u[o+5],pb:u[o+6],mb:u[o+7],kb:u[o+8],ch:u[o+9],sr:r32(u,o+20)};
const sz=g('stsz'),sc=g('stsc'),co=g('stco')||g('co64');if(!sz||!sc||!co)throw new Error('bad alac');
const n=r32(u,sz.s+8),ss=r32(u,sz.s+4),sizes=new Uint32Array(n);
if(ss)sizes.fill(ss);else for(let i=0;i<n;i++)sizes[i]=r32(u,sz.s+12+4*i);
const m=r32(u,sc.s+4),first=[],spc=[];for(let i=0;i<m;i++){first.push(r32(u,sc.s+8+12*i));spc.push(r32(u,sc.s+12+12*i))}
const cn=r32(u,co.s+4),big=co.n==='co64',offs=new Float64Array(n);let si=0,ei=0;
for(let ci=0;ci<cn;ci++){while(ei+1<m&&first[ei+1]<=ci+1)ei++;
let pos=big?r32(u,co.s+8+8*ci)*4294967296+r32(u,co.s+12+8*ci):r32(u,co.s+8+4*ci);
for(let j=0;j<spc[ei]&&si<n;j++){offs[si]=pos;pos+=sizes[si];si++}}
return{cfg,sizes,offs}}
return null}
async function findAtom(b,name){let p=0;while(p+8<=b.size){const d=new DataView(await b.slice(p,p+16).arrayBuffer());let sz=d.getUint32(0),hd=8;const nm=String.fromCharCode(d.getUint8(4),d.getUint8(5),d.getUint8(6),d.getUint8(7));
if(sz===1&&d.byteLength>=16){sz=d.getUint32(8)*4294967296+d.getUint32(12);hd=16}else if(sz===0)sz=b.size-p;if(nm===name)return{s:p+hd,e:p+sz};if(sz<8)break;p+=sz}return null}
async function alacInfo(b){const mv=await findAtom(b,'moov');if(!mv)return null;return parseAlac(new Uint8Array(await b.slice(mv.s,mv.e).arrayBuffer()))}

class BR{constructor(u){this.u=u;this.p=0}
pk(n){const p=this.p,i=p>>3,u=this.u;return((u[i]<<24|u[i+1]<<16|u[i+2]<<8|u[i+3])<<(p&7))>>>(32-n)}
bits(n){if(n===0)return 0;if(n<=25){const v=this.pk(n);this.p+=n;return v}const hi=this.bits(n-16);return hi*65536+this.bits(16)}
sbits(n){const v=this.bits(n);return n<32?(v<<(32-n))>>(32-n):v|0}}
function scalar(br,k,bps){const inv=(~br.pk(9))&511;let x;
if(inv===0){x=9;br.p+=9}else{x=Math.clz32(inv)-23;br.p+=x+1}

if(NAT()){io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const t=Q()[+e.target.dataset.i];if(t)artFor(t).then(u=>{if(u)e.target.src=u})}}),{rootMargin:'300px'});
$('list').querySelectorAll('img:not([src])').forEach(i=>io.observe(i))}
markCur(false);updHint()}
function markCur(scroll){document.querySelectorAll('.row.cur').forEach(r=>{r.classList.remove('cur');const b=r.querySelector('b');b.classList.remove('mq','run')});
const r=cur>=0&&document.querySelector(`.row[data-i="${cur}"]`);if(r){r.classList.add('cur');const b=r.querySelector('b');b.classList.add('mq');fitMq(b);if(scroll&&matchMedia('(min-width:1000px)').matches)r.scrollIntoView({block:'nearest'})}}

/* ---------- scrolling text for long names ---------- */
function fitMq(el){const s=el.firstElementChild;el.classList.remove('run');el.style.removeProperty('--d');
requestAnimationFrame(()=>{const w=s.scrollWidth,c=el.clientWidth;if(c&&w>c+2){el.style.setProperty('--d',(c-w-8)+'px');el.style.setProperty('--t',Math.max(5,(w-c)/16)+'s');el.classList.add('run')}})}
function fitSvg(el,max){try{el.classList.remove('run');el.style.removeProperty('--d');const w=el.getComputedTextLength();
if(w>max+1){el.style.setProperty('--d',(max-w-6)+'px');el.style.setProperty('--t',Math.max(5,(w-max)/16)+'s');el.classList.add('run')}}catch(e){}}
function fitAll(){document.querySelectorAll('.mq').forEach(fitMq);fitSvg($('tC'),290);fitSvg($('sC'),232)}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitAll,200)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(fitAll,50));

/* ---------- demo tape synth ---------- */
const N_=n=>440*Math.pow(2,(n-69)/12);
function toWav(b){const n=b.length,c=b.numberOfChannels,v=new DataView(new ArrayBuffer(44+n*c*2)),s=(o,t)=>[...t].forEach((x,i)=>v.setUint8(o+i,x.charCodeAt(0)));
s(0,'RIFF');v.setUint32(4,36+n*c*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*c*2,true);
const ch=[...Array(c).keys()].map(i=>b.getChannelData(i));let o=44;
for(let i=0;i<n;i++)for(let k=0;k<c;k++){v.setInt16(o,Math.max(-1,Math.min(1,ch[k][i]))*32767,true);o+=2}
return new Blob([v],{type:'audio/wav'})}
async function synth(t,len=48){const sr=22050,o=new OfflineAudioContext(2,sr*len,sr),m=o.createGain();m.gain.value=.5;m.connect(o.destination);const st=60/t.bpm/2;
const tone=(w,f,d,type,v,pan)=>{const os=o.createOscillator(),g=o.createGain(),p=o.createStereoPanner();os.type=type;os.frequency.value=f;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v,w+.01);g.gain.exponentialRampToValueAtTime(.0001,w+d);p.pan.value=pan;os.connect(g);g.connect(p);p.connect(m);os.start(w);os.stop(w+d+.05)};
for(let i=0;i*st<len;i++){const w=i*st,r=t.root+t.prog[Math.floor(i/8)%t.prog.length],k=t.arp[i%t.arp.length];
if(k>=0)tone(w,N_(r+12+t.sc[k%t.sc.length]+12*Math.floor(k/t.sc.length)),st*1.8,t.wave,t.v,i%2?.3:-.3);
if(i%8==0)tone(w,N_(r-12),st*6,t.bass,t.b,0);
if(t.k&&i%4==0){const os=o.createOscillator(),g=o.createGain();os.frequency.setValueAtTime(130,w);os.frequency.exponentialRampToValueAtTime(40,w+.12);g.gain.setValueAtTime(.7,w);g.gain.exponentialRampToValueAtTime(.001,w+.16);os.connect(g);g.connect(m);os.start(w);os.stop(w+.2)}}
return toWav(await o.startRendering())}

/* ---------- audio graph + tape / vinyl character ---------- */
function ensure(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();
const src=ctx.createMediaElementSource(A);lpf=ctx.createBiquadFilter();lpf.type='lowpass';an=ctx.createAnalyser();an.fftSize=512;vg=ctx.createGain();vg.gain.value=vol;
src.connect(lpf);lpf.connect(an);an.connect(vg);vg.connect(ctx.destination);
nbuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const ns=ctx.createBufferSource();ns.buffer=nbuf;ns.loop=true;hpf=ctx.createBiquadFilter();hpf.type='highpass';hiss=ctx.createGain();hiss.gain.value=0;ns.connect(hpf);hpf.connect(hiss);hiss.connect(ctx.destination);ns.start();applyFx()}
function applyFx(){if(!ctx)return;lpf.frequency.value=TH[th].lp;hpf.frequency.value=TH[th].hp;setMode(mode)}
function click(){ensure();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='square';o.frequency.value=th==='cd'?900:70;g.gain.setValueAtTime(.1*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.05)}
function pop(){const s=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;s.buffer=nbuf;g.gain.setValueAtTime(.22*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.012);s.connect(g);g.connect(ctx.destination);s.start(t,Math.random()*1.9,.02)}
function setMode(m){mode=m;$('play').classList.toggle('on',m==='play');$('rew').classList.toggle('on',m==='rew');$('ff').classList.toggle('on',m==='ff');
$('play').innerHTML=m==='play'?'&#10074;&#10074;':'&#9654;&#xFE0E;';if(hiss)hiss.gain.value=({play:1,ff:2,rew:2}[m]||0)*TH[th].hiss*vol}

/* ---------- player ---------- */
const med={cas:$('mC'),cd:$('mD'),lp:$('mV')},svs={cas:$('sv-cas'),cd:$('sv-cd'),lp:$('sv-lp')};
function setArt(u){for(const i of['aC','aD','aV'])$(i).setAttribute('href',u)}
const subOf=t=>t.artist||t.album||(t.demo?'Demo tape':'Side A');
function show(t){setArt(t.art||t.artG||(t.artG=genArt(t.name+(t.artist||''))));
if(!t.art)artFor(t).then(u=>{if(u&&Q()[cur]===t)setArt(u)});
$('npT').firstElementChild.textContent=t.name;$('npA').textContent=[t.artist,t.album].filter(Boolean).join(' / ');
$('tC').textContent=t.name;$('sC').textContent=subOf(t);$('lC').textContent=t.dur?fmt(t.dur):'';fitAll();
if('mediaSession'in navigator&&window.MediaMetadata){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||'',album:t.album||'',artwork:[{src:t.art||t.artG,sizes:'256x256',type:'image/jpeg'}]})}catch(e){}}}
async function anim(c){const e=med[th];e.classList.remove('in','out');void e.getBoundingClientRect();e.classList.add(c);if(c==='in'){await wait(540);e.classList.remove('in')}else await wait(450)}
async function srcOf(t,g,say){let b;
if(t.demo){say('winding tape...');b=t.blob||(t.blob=await synth(t.spec))}
else b=t.blob||await readNative(t,g,say);
if(g!==gen)throw 0;b=await normalize(b,say);if(g!==gen)throw 0;
if(curUrl)URL.revokeObjectURL(curUrl);curBlob=b;return curUrl=URL.createObjectURL(b)}
async function prep(t,g){const say=m=>{if(g===gen)$('sC').textContent=m};
try{const u=await srcOf(t,g,say);if(g!==gen)return;A.src=u;
if(t.dev&&!t.art){const m=await meta(curBlob);if(m.pic&&g===gen){try{t.art=await squareArt(m.pic);setArt(t.art)}catch(e){}}}}
catch(e){if(g===gen&&e!==0)toast(`Can't play this file${e&&e.message?': '+e.message:''}`)}
finally{if(g===gen)$('sC').textContent=subOf(t)}}
async function go(i,auto=true,first=false){if(busy)return;busy=1;const g=++gen;
try{A.pause();A.removeAttribute('src');A.load();setMode('stop');if(!first)await anim('out');cur=i;const t=Q()[i];show(t);markCur(true);
pend=prep(t,g);await anim('in')}finally{busy=0}
if(auto)play()}
async function play(){if(busy)return;ensure();await ctx.resume();if(cur<0)return go(0,true);if(pend)await pend;if(!A.getAttribute('src'))return;A.playbackRate=1;try{await A.play();setMode('play')}catch(e){setMode('pause')}}
function pause(){A.pause();setMode('pause')}
function step(d){const n=Q().length;if(!n||busy)return;if(d<0&&A.currentTime>3){A.currentTime=0;return}
let i=(cur+d+n)%n;if(shuf&&n>1)do i=Math.floor(Math.random()*n);while(i===cur);go(i,true)}
A.onended=()=>{if(mode!=='play')return;if(rep===2){A.currentTime=0;A.play();return}if(!shuf&&cur===Q().length-1&&rep===0){setMode('stop');A.currentTime=0;return}step(1)};
A.onloadedmetadata=()=>{$('lC').textContent=fmt(A.duration)};
A.onerror=()=>{if(A.getAttribute('src'))toast("This phone can't play that file")};
function setTheme(t,a){th=t;ls.set('th',t);document.querySelector('.app').dataset.th=t;for(const k in svs)svs[k].style.display=k===t?'block':'none';
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));applyFx();fitAll();if(a)anim('in')}

/* ---------- controls ---------- */
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t!==th){setTheme(b.dataset.t,true);try{click()}catch(x){}}};
$('play').onclick=()=>{click();mode==='play'?pause():play()};
$('stop').onclick=()=>{click();A.pause();if(A.getAttribute('src'))A.currentTime=0;setMode('stop')};
$('prev').onclick=()=>{click();step(-1)};$('next').onclick=()=>{click();step(1)};
$('add').onclick=()=>{click();$('file').click()};
$('file').onchange=e=>{const f=e.target.files;if(f&&f.length)addFiles(f);e.target.value=''};
$('scan').onclick=()=>{click();scanDevice()};
$('shuf').onclick=()=>{click();shuf=!shuf;ls.set('shuf',shuf?1:0);$('shuf').classList.toggle('on',shuf)};
$('rep').onclick=()=>{click();rep=(rep+1)%3;ls.set('rep',rep);$('rep').textContent=['repeat off','repeat all','repeat one'][rep];$('rep').classList.toggle('on',rep>0)};
$('vol').oninput=e=>{vol=+e.target.value;ls.set('vol',vol);if(vg)vg.gain.value=vol;setMode(mode)};
$('sort').onchange=e=>{sortM=e.target.value;ls.set('sort',sortM);rebuild()};
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(renderList,150)};
function scan(btn,m){let on=0,was;
btn.onpointerdown=e=>{e.preventDefault();if(cur<0||busy||!A.getAttribute('src'))return;click();on=1;was=mode;A.pause();setMode(m);try{btn.setPointerCapture(e.pointerId)}catch(x){}};
const end=()=>{if(!on)return;on=0;if(was==='play')play();else setMode(was==='rew'||was==='ff'?'pause':was)};
btn.onpointerup=btn.onpointercancel=end;btn.oncontextmenu=e=>e.preventDefault()}
scan($('rew'),'rew');scan($('ff'),'ff');
let sk=0;const seek=$('seek');seek.onpointerdown=()=>sk=1;seek.onpointerup=seek.onpointercancel=()=>sk=0;
seek.oninput=()=>{if(isFinite(A.duration))A.currentTime=seek.value/1000*A.duration};
$('list').onclick=e=>{const x=e.target.closest('[data-d]');if(x){click();del(x.dataset.d);return}
const r=e.target.closest('[data-i]');if(r){click();const i=+r.dataset.i;i===cur?(mode==='play'?pause():play()):go(i,true)}};
if('mediaSession'in navigator){const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};h('play',play);h('pause',pause);h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1))}

/* ---------- animation loop ---------- */
const rL=$('rL'),rR=$('rR'),pL=$('pL'),pR=$('pR'),tp=$('tp'),rD=$('rD'),rV=$('rV'),arm=$('arm'),ctr=$('ctr'),nl=$('vl').firstElementChild,nr=$('vr').firstElementChild;
let la=0,ra=0,da=0,va=0,armA=0,sp=0,vu=0,last=performance.now();const buf=new Uint8Array(512);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const d=A.duration;
if((mode==='ff'||mode==='rew')&&A.getAttribute('src')&&isFinite(d)){A.currentTime=Math.max(0,A.currentTime+(mode==='ff'?7:-9)*dt);
if(mode==='rew'&&A.currentTime<=0)setMode('pause');else if(mode==='ff'&&A.currentTime>=d-.3){setMode('stop');step(1)}}
const p=isFinite(d)&&d?A.currentTime/d:0;
sp+=((({play:1,ff:5,rew:-5})[mode]||0)-sp)*Math.min(1,dt*6);
if(th==='cas'){const r1=31-15*p,r2=16+15*p;la+=sp*dt*4000/r1;ra+=sp*dt*4000/r2;
rL.setAttribute('transform',`rotate(${la%360})`);rR.setAttribute('transform',`rotate(${ra%360})`);pL.setAttribute('r',r1);pR.setAttribute('r',r2);tp.setAttribute('d',`M120 ${146+r1}L150 194H210L240 ${146+r2}`)}
else if(th==='cd'){da+=sp*dt*(520-260*p);rD.setAttribute('transform',`rotate(${da%360} 180 115)`)}
else{va+=sp*dt*200;rV.setAttribute('transform',`rotate(${va%360} 130 115)`);armA+=((mode==='stop'?0:40+16*p)-armA)*Math.min(1,dt*3);arm.setAttribute('transform',`rotate(${armA.toFixed(2)} 318 35)`);
if(ctx&&mode==='play'&&Math.random()<dt*2.2)pop()}
const t=fmt(A.currentTime);if(ctr.textContent!==t)ctr.textContent=t;
if(!sk)seek.value=p*1000;
let lv=0;if(an&&mode==='play'){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}lv=Math.min(1,Math.sqrt(s/buf.length)*3.5)}
vu+=(lv-vu)*(lv>vu?.4:.12);
nl.style.transform=`rotate(${-50+100*vu}deg)`;nr.style.transform=`rotate(${-50+100*Math.min(1,vu*(.9+.1*Math.sin(now/530)))}deg)`;
if(mode==='play')A.playbackRate=1+TH[th].wow*(Math.sin(now/310)+.5*Math.sin(now/97));
requestAnimationFrame(frame)}

/* ---------- start ---------- */
(async()=>{$('vol').value=vol;$('sort').value=sortM;$('shuf').classList.toggle('on',shuf);$('rep').textContent=['repeat off','repeat all','repeat one'][rep];$('rep').classList.toggle('on',rep>0);
$('scan').hidden=!NAT();
try{db=await Promise.race([openDB(),wait(2500).then(()=>{throw 0})]);added=(await tx('readonly',s=>s.getAll())||[]).map(r=>(r.key='a'+r.id,r))}catch(e){db=null;added=[]}
setTheme(ls.get('th')||'cas');requestAnimationFrame(frame);
rebuild();
if(NAT())await scanDevice();
rebuild();await go(0,false,true)})();
</script></body></html>
