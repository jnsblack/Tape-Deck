<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131514">
<title>Tape Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--desk:#c2c6c2;--ink:#1d1f1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#131514;--ink:#e6e6e0}}
:root[data-theme="dark"]{--desk:#131514;--ink:#e6e6e0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Share Tech Mono","Courier New",monospace;display:flex;justify-content:center;padding:8px;min-height:100vh}
.app{--ar:.72;--frame:#5b3d28;--p1:#585d5f;--p2:#383c3d;--k1:#d6d9d7;--k2:#9a9e9d;--ks:#44484a;--kc:#222;--ac:#d9822b;--fg:#e8e4d6;--lcd:#f0ecdc;--lcdbg:#0d0e0e;
width:100%;max-width:560px;display:grid;gap:14px;align-content:start;color:var(--fg)}
.app[data-th=cd]{--ar:1;--frame:#8f969c;--p1:#30353a;--p2:#16191c;--k1:#e6e9ec;--k2:#a9b0b6;--ks:#555b61;--kc:#1b1d1f;--ac:#3fb6ff;--fg:#dfe6ec;--lcd:#7fd3ff;--lcdbg:#051017}
.app[data-th=lp]{--ar:1;--frame:#3a2616;--p1:#80593a;--p2:#5c3c26;--k1:#f0e4c6;--k2:#c8b78e;--ks:#6a5636;--kc:#3a2a18;--ac:#e0a030;--fg:#f5ead0;--lcd:#ffc46b;--lcdbg:#1a1008}
.deck,.lib{border:9px solid var(--frame);border-radius:18px;padding:10px;min-width:0;box-shadow:0 18px 34px #0006,inset 0 0 0 2px #0003;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 3px),linear-gradient(var(--p1),var(--p2));transition:border-color .4s}
.lib{border-width:8px}
@media (min-width:600px){.app{max-width:740px}}
@media (min-width:1000px){
.app{max-width:1200px;grid-template-columns:minmax(450px,600px) minmax(0,1fr);align-items:start}
.lib{position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.lib ul{overflow:auto;min-height:0;flex:1}
.lib li{content-visibility:auto;contain-intrinsic-size:auto 52px}}
@media (min-width:1000px) and (min-height:940px){.deck{position:sticky;top:14px}}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:8px;background:#0003;color:var(--fg);font-size:14px}
.tabs button.on{background:var(--ac);color:#111}
.tabs .gear{flex:none;width:46px;font-size:18px;padding:0}
.set{background:#0003;border-radius:8px;padding:10px;margin-bottom:10px;display:grid;gap:10px;font-size:13px}
.set[hidden]{display:none}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.srow>span{width:66px;opacity:.85}
.seg{display:flex;gap:4px;flex:1;min-width:200px}.seg button{flex:1;padding:8px 4px;border:0;border-radius:6px;background:#0003;color:var(--fg);font-size:12px}.seg button.on{background:var(--ac);color:#111}
.sw{display:flex;gap:9px;flex-wrap:wrap;flex:1}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff5;background:var(--c);padding:0}.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.win{position:relative;overflow:visible;margin:46px 0 30px;background:#0d0e0e;border:2px solid #0006;border-radius:10px;padding:6px}

svg{display:block;width:100%;height:auto}
#sv-cd,#sv-lp{touch-action:none}
@keyframes sweepX{0%{opacity:0}}
.lidbox{position:absolute;left:6px;top:6px;right:6px;bottom:6px;perspective:900px;perspective-origin:50% 50%;pointer-events:none;z-index:8}
.lid3d{position:absolute;left:0;top:0;width:var(--W,380px);height:var(--H,243px);transform-origin:50% 0;transform-style:preserve-3d;will-change:transform}
.gl{position:absolute;left:0;top:0;transform-origin:0 0;box-sizing:border-box;border-top:1.5px solid rgba(255,255,255,.5);border-bottom:1.5px solid rgba(255,255,255,.62);background:linear-gradient(rgba(255,255,255,.05),rgba(190,215,235,.05))}
.gl.top{width:var(--W,380px);height:var(--H,243px);transform:translateZ(var(--D,52px));border:2px solid rgba(255,255,255,.6);border-radius:var(--R,20px);background:linear-gradient(115deg,rgba(255,255,255,0) 0 6%,rgba(255,255,255,.17) 6% 24%,rgba(255,255,255,0) 24% 31%,rgba(255,255,255,.11) 31% 40%,rgba(255,255,255,0) 40%),linear-gradient(135deg,rgba(255,255,255,.07),rgba(190,215,235,.04) 60%,rgba(255,255,255,.06))}
.barrel{position:absolute;top:-6px;width:13%;height:12px;border-radius:6px;background:linear-gradient(#f4f6f7,#b9bfc3 50%,#8a9095);box-shadow:0 1px 2px #0006,inset 0 1px 0 #fff;z-index:9}
.hw{font-family:"Special Elite","Courier New",monospace}
#mC,#mD{transform-origin:180px 115px}#mV{transform-origin:130px 115px}
#mC.out{animation:cOut .44s ease-in forwards}#mC.in{animation:cIn .52s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cOut{to{transform:translateY(-60px) scale(1.2) rotate(-5deg);opacity:0}}
@keyframes cIn{from{transform:scale(.55);opacity:0;filter:blur(3px)}to{filter:blur(0)}}
#mD.out{animation:dOut .44s ease-in forwards}#mD.in{animation:dIn .52s ease-out both}
@keyframes dOut{to{transform:translate(70px,-50px) scale(1.18);opacity:0}}
@keyframes dIn{from{transform:scale(.55);opacity:0;filter:blur(3px)}to{filter:blur(0)}}
#mV.out{animation:vOut .44s ease-in forwards}#mV.in{animation:vIn .55s ease-out both}
@keyframes vOut{to{transform:translate(80px,-50px) scale(1.18) rotate(24deg);opacity:0}}
@keyframes vIn{from{transform:scale(.55);opacity:0;filter:blur(3px)}to{filter:blur(0)}}
/* scrolling text */
.mq{overflow:hidden;white-space:nowrap}
.mq>em{display:inline-block;font-style:normal}
.mq.run>em,.mt.run{animation:mqx var(--t,8s) ease-in-out infinite alternate}
@keyframes mqx{0%,14%{transform:translateX(0)}86%,100%{transform:translateX(var(--d,0px))}}
.np{display:flex;flex-direction:column;align-items:center;margin:4px 0 0;min-height:44px;text-align:center}
.np b{display:block;max-width:100%;font-size:17px;font-weight:400}
.np small{font-size:13px;opacity:.75;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meters{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin:10px 0;align-items:center}
.vu{position:relative;height:60px;border-radius:6px;overflow:hidden;border:3px solid #0008;background:radial-gradient(circle at 50% 125%,#f3e6b4 0,#d8c685 75%);box-shadow:inset 0 0 12px #0006}
.vu i{position:absolute;left:50%;bottom:-6px;width:2px;height:52px;background:#b1281d;transform-origin:50% 100%;transform:rotate(-50deg)}
.vu b{position:absolute;left:7px;top:3px;font-size:12px;color:#3a2f12}
.vu::after{content:"";position:absolute;right:9px;top:11px;width:22px;height:4px;background:#b1281d;border-radius:2px;transform:rotate(38deg)}
.counter{background:var(--lcdbg);color:var(--lcd);font-size:26px;padding:8px 12px;border-radius:4px;border:2px solid #0008;letter-spacing:2px;text-shadow:0 0 7px var(--lcd)}
#bar{display:block;width:100%;height:48px;margin:6px 0 2px;touch-action:none;cursor:pointer}
.vrow{display:flex;align-items:center;gap:12px;margin:2px 2px 8px;font-size:14px}
.vrow span{width:30px}
.fader{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:46px;margin:0;background:repeating-linear-gradient(90deg,#ffffff70 0 1px,transparent 1px 10%) center/calc(100% - 26px) 18px no-repeat;background-position:13px center;touch-action:pan-y;cursor:pointer}
.fader::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(#000d,#0007);box-shadow:inset 0 2px 3px #000,0 1px 0 #ffffff40}
.fader::-moz-range-track{height:8px;border-radius:4px;background:#000a}
.fader::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:42px;margin-top:-17px;border-radius:5px;border:1px solid #0009;background:linear-gradient(#f4f6f7,#cfd3d6 13%,#9ea3a7 44%,var(--ac) 46% 54%,#9ea3a7 56%,#cfd3d6 87%,#f4f6f7);box-shadow:0 5px 7px #000b,inset 0 1px 0 #fffb}
.fader::-moz-range-thumb{width:26px;height:42px;border-radius:5px;border:1px solid #0009;background:linear-gradient(#f4f6f7,#9ea3a7 46%,var(--ac) 46% 54%,#9ea3a7 54%,#f4f6f7)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-bottom:5px}
.keys button{height:54px;border:0;border-radius:4px 4px 6px 6px;background:linear-gradient(var(--k1),var(--k2));color:var(--kc);font-size:15px;box-shadow:0 5px 0 var(--ks),0 7px 8px #0007;transition:transform .06s,box-shadow .06s;-webkit-user-select:none;user-select:none}
.keys button.on,.keys button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ks);filter:brightness(.88)}
.chips{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.chips button{flex:1;min-width:76px;padding:8px 4px;border:0;border-radius:99px;background:#0003;color:var(--fg);font-size:13px}
.chips button.on{background:var(--ac);color:#111}
/* library */
.lh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lh b{font-size:18px;font-weight:400}.lh small{opacity:.7;flex:1;font-size:13px}
.lh button{margin-left:2px;width:44px;height:38px;border:0;border-radius:6px;background:#0003;color:var(--fg);font-size:20px}
.lf{display:flex;gap:6px;margin-bottom:8px}
.lf input,.lf select{background:#0004;color:var(--fg);border:1px solid #fff3;border-radius:6px;padding:9px 10px;font:inherit;font-size:14px;min-width:0}
.lf input{flex:1}.lf option{color:#111}
.hint{font-size:13px;line-height:1.45;margin:6px 2px 10px;opacity:.9}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
ul.list li{display:flex;gap:6px;content-visibility:auto;contain-intrinsic-size:auto 52px}
ul.grid{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:18px 12px;padding:4px 2px 8px}
ul.grid li{position:relative}
.more{grid-column:1/-1;height:1px}
.case{display:block;width:100%;border:0;padding:0;background:none;color:inherit;text-align:left}
.case .box{position:relative;display:block;width:100%;aspect-ratio:var(--ar);perspective:700px}
.app[data-th=lp] .case .box{width:80%}
.case .inner{position:absolute;inset:0;border-radius:4px;background:#0b0c0d;overflow:hidden;box-shadow:inset 0 0 0 1px #fff2,inset 0 0 14px #000}
.case .inner::before{content:"";position:absolute;border-radius:6px;background:#2b2622;box-shadow:inset 0 0 0 2px #0a0908}
.app[data-th=cas] .case .inner::before{left:7%;right:7%;top:25%;bottom:25%}
.app[data-th=cd] .case .inner::before{inset:9%;border-radius:50%;background:radial-gradient(circle,#0b0c0d 0 11%,#cfd3d8 12% 17%,#6e747b 18% 100%)}
.app[data-th=lp] .case .inner{display:none}
.case .cover{position:absolute;inset:0;overflow:hidden;transform-origin:0 50%;transition:transform .4s cubic-bezier(.3,.7,.3,1);backface-visibility:hidden;box-shadow:0 6px 11px #000a;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 50) 60% 20%))}
.case.opening .cover{transform:rotateY(-112deg)}
.app[data-th=lp] .case.opening .cover{transform:none}
.case .cover img{width:100%;height:100%;object-fit:cover;display:block}.case .cover img:not([src]){display:none}
.case .spine,.case .glare,.case .frame{position:absolute;pointer-events:none}
.case .glare,.case .frame{inset:0}
.app[data-th=cas] .case .cover{border-radius:3px}
.app[data-th=cas] .case .spine{left:0;top:0;bottom:0;width:13%;background:linear-gradient(90deg,#0a0a0a,#1d1d1d 70%,#ffffff30);color:#e9e9e9;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:6px 3px;box-shadow:inset -2px 0 3px #0008}
.app[data-th=cas] .case .frame{border-radius:3px;box-shadow:inset 0 0 0 3px #ffffff4a,inset 0 0 0 4px #0000002e,inset 0 0 18px #ffffff1c;background:linear-gradient(118deg,#ffffff44 0,#ffffff00 28%,#ffffff00 66%,#ffffff2a 100%)}
.app[data-th=cas] .case .frame::before{content:"";position:absolute;right:7%;top:-1px;width:18%;height:5%;background:#ffffff55;border-radius:0 0 3px 3px}
.app[data-th=cd] .case .cover{border-radius:2px}
.app[data-th=cd] .case .spine{left:0;top:0;bottom:0;width:11%;background:linear-gradient(90deg,#050505,#161616 60%,#2a2a2a);color:#d9d9d9;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:6px 3px}
.app[data-th=cd] .case .frame{border-radius:2px;box-shadow:inset 0 0 0 2px #ffffff66,inset 0 0 0 3px #00000040,inset 0 0 0 7px #ffffff12;background:linear-gradient(122deg,#ffffff66 0,#ffffff00 24%,#ffffff00 58%,#ffffff40 100%)}
.app[data-th=cd] .case .frame::before,.app[data-th=cd] .case .frame::after{content:"";position:absolute;left:3%;width:6%;height:9%;background:#cfd3d8;border-radius:2px;box-shadow:0 0 0 1px #0006}
.app[data-th=cd] .case .frame::before{top:12%}.app[data-th=cd] .case .frame::after{bottom:12%}
.app[data-th=lp] .case .cover{border-radius:2px;box-shadow:0 5px 10px #000a,inset 0 0 0 1px #0004}
.app[data-th=lp] .case .spine{display:none}
.app[data-th=lp] .case .frame{background:radial-gradient(circle at 50% 50%,#0000 0 57%,#ffffff26 57.5% 59.5%,#0000 60%),linear-gradient(140deg,#ffffff26,#0000 35%,#0000 70%,#0000002e)}
.case .rec{display:none;position:absolute;top:6%;left:26%;width:92%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c8b78e 0 12%,#0d0d0d 13% 100%);box-shadow:0 4px 8px #000b;transition:transform .35s ease-out}
.case .rec::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#ffffff00 0 2px,#ffffff10 2px 3px)}
.app[data-th=lp] .case .rec{display:block}
.app[data-th=lp] .case.opening .rec,.app[data-th=lp] .case.cur .rec{opacity:0;transition:none}
.case .ct{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.25;margin-top:7px}
.case .ca{display:block;font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case.cur .box::after{content:"";position:absolute;inset:-4px;border:2px solid var(--ac);border-radius:6px;pointer-events:none}
.case.cur .ct{color:var(--ac)}
.xdel{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px;padding:0;z-index:3}
.fly{position:fixed;left:0;top:0;z-index:30;pointer-events:none;will-change:transform,filter,opacity;filter:drop-shadow(0 12px 14px #000b)}
.fly svg{display:block;width:100%;height:auto}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--k1);color:var(--kc);border:0;border-left:6px solid var(--k2);border-radius:4px;padding:6px 10px 6px 6px;text-align:left}
.row.cur{border-left-color:var(--ac);filter:brightness(1.06)}
.th{width:40px;height:40px;border-radius:3px;flex:none;display:block;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 50) 60% 20%))}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th img:not([src]){display:none}
.row>span{display:flex;flex-direction:column;min-width:0;flex:1}
.row b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;font-size:15px}
.row b.mq{text-overflow:clip}
.row b em{font-style:normal}
.row small{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:44px;border:0;border-radius:4px;background:#0003;color:var(--fg);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#000d;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>

<div class="set" id="set" hidden>
<div class="srow"><span>Play bar</span><div class="seg" id="bst"><button data-v="def">Default</button><button data-v="wavy">Wavy</button><button data-v="sq">Squiggly</button></div></div>
<div class="srow"><span>UI colour</span><div class="sw" id="bcol"></div></div>
</div>
<div class="win">

/* ---------- tag reading: ID3 (mp3), FLAC, MP4/M4A ---------- */
function txt(b){const e=b[0];let l=['iso-8859-1','utf-16le','utf-16be','utf-8'][e]||'utf-8';if(e===1&&b[1]===0xFE&&b[2]===0xFF)l='utf-16be';return new TextDecoder(l).decode(b.subarray(1)).replace(/\0+$/,'').split('\0')[0]}

if(u[5]&64){p+=ver==4?((u[10]&127)<<21|(u[11]&127)<<14|(u[12]&127)<<7|(u[13]&127)):4+(u[10]<<24|u[11]<<16|u[12]<<8|u[13])}
while(p+10<end){const id=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
const sz=ver==4?((u[p+4]&127)<<21|(u[p+5]&127)<<14|(u[p+6]&127)<<7|(u[p+7]&127)):((u[p+4]<<24|u[p+5]<<16|u[p+6]<<8|u[p+7])>>>0);
const b=u.subarray(p+10,p+10+sz);p+=10+sz;
if(id==='TIT2')o.title=txt(b)||o.title;else if(id==='TPE1')o.artist=txt(b);else if(id==='TALB')o.album=txt(b);
else if(id==='APIC'&&!o.pic){let i=1;while(b[i])i++;const mime=String.fromCharCode(...b.subarray(1,i));i+=2;
if(b[0]===1||b[0]===2){while(!(b[i]===0&&b[i+1]===0)&&i<b.length)i+=2;i+=2}else{while(b[i])i++;i++}
o.pic=new Blob([b.subarray(i)],{type:mime.includes('/')?mime:'image/jpeg'})}}}
function flac(u,o){let p=4;for(;;){const last=u[p]>>7,t=u[p]&127,len=u[p+1]<<16|u[p+2]<<8|u[p+3],b=u.subarray(p+4,p+4+len),dv=new DataView(b.buffer,b.byteOffset,b.byteLength);p+=4+len;

if(last||p>=u.length)break}}
function mp4(u,o){const f=(s,from=0)=>{const a=[...s].map(c=>c.charCodeAt(0));outer:for(let i=from;i<u.length-a.length;i++){for(let k=0;k<a.length;k++)if(u[i+k]!==a[k])continue outer;return i}return -1};
const rd=n=>{const i=f(n);if(i<0)return null;const j=f('data',i);if(j<0)return null;const sz=new DataView(u.buffer,u.byteOffset+j-4,4).getUint32(0);return u.subarray(j+12,j-4+sz)};
const s=n=>{const b=rd(n);return b?new TextDecoder().decode(b):''};
o.title=s('\xA9nam')||o.title;o.artist=o.artist||s('\xA9ART');o.album=o.album||s('\xA9alb');
if(!o.pic){const c=rd('covr');if(c&&c.length>100)o.pic=new Blob([c],{type:c[0]===0x89?'image/png':'image/jpeg'})}}
async function meta(file,name){const o={title:clean((name||file.name||'').replace(/\.[^.]+$/,'')),artist:'',album:'',pic:null};
try{const u=new Uint8Array(await file.slice(0,Math.min(file.size,3e6)).arrayBuffer());
if(u[0]===73&&u[1]===68&&u[2]===51)id3(u,o);

$('bst').onclick=e=>{const b=e.target.closest('button');if(b){bStyle=b.dataset.v;ls.set('bstyle',bStyle);markSet()}};
$('bcol').onclick=e=>{const b=e.target.closest('button');if(b){uiCol=b.dataset.c;ls.set('ui',uiCol);applyUi()}};
$('retro').onclick=()=>{click();retro=!retro;ls.set('retro',retro?1:0);$('retro').classList.toggle('on',retro);setMode(mode)};
$('vmode').onclick=()=>{click();viewM=viewM==='grid'?'list':'grid';ls.set('view',viewM);renderList()};
$('hit').onclick=()=>{click();mode==='play'?pause():play()};
const pt=(e,svg)=>{const m=svg.getScreenCTM();return m?new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()):{x:0,y:0}};
let drag=0,armDrag=0;
function disc(svg,name,cx,cy,R,spr,rot){let st=null;
svg.addEventListener('pointerdown',e=>{if(th!==name||e.target.closest('#arm'))return;const p=pt(e,svg);if(Math.hypot(p.x-cx,p.y-cy)>R)return;
e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(x){}
st={a:Math.atan2(p.y-cy,p.x-cx)*180/Math.PI,m:0,t:performance.now(),was:mode};drag=1;if(mode==='play'){A.pause();setMode('pause')}});
svg.addEventListener('pointermove',e=>{if(!st)return;const p=pt(e,svg),a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;let d=a-st.a;if(d>180)d-=360;if(d<-180)d+=360;st.a=a;st.m+=Math.abs(d);rot(d);
if(A.getAttribute('src')&&isFinite(A.duration))A.currentTime=clamp(A.currentTime+d/360*spr,0,A.duration)});
const end=()=>{if(!st)return;const s=st;st=null;drag=0;if(s.m<6&&performance.now()-s.t<450){s.was==='play'?pause():play()}else if(s.was==='play')play()};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end)}
disc($('sv-cd'),'cd',180,115,98,2.2,d=>{da+=d});
disc($('sv-lp'),'lp',130,115,100,1.8,d=>{va+=d});
const lpSvg=$('sv-lp');let armSt=null;
lpSvg.addEventListener('pointerdown',e=>{if(th!=='lp'||!e.target.closest('#arm'))return;e.preventDefault();try{lpSvg.setPointerCapture(e.pointerId)}catch(x){}armSt={was:mode};armDrag=1;if(mode==='play'){A.pause();setMode('pause')}});
lpSvg.addEventListener('pointermove',e=>{if(!armSt)return;const p=pt(e,lpSvg);armA=clamp(Math.atan2(-(p.x-318),p.y-35)*180/Math.PI,0,62);
if(armA>=38&&A.getAttribute('src')&&isFinite(A.duration))A.currentTime=clamp((armA-40)/16)*A.duration});
const armEnd=()=>{if(!armSt)return;armSt=null;armDrag=0;if(armA>=38&&A.getAttribute('src'))play();else{A.pause();setMode('stop')}};
lpSvg.addEventListener('pointerup',armEnd);lpSvg.addEventListener('pointercancel',armEnd);

/* ---------- animation loop ---------- */
const rL=$('rL'),rR=$('rR'),pL=$('pL'),pR=$('pR'),tp=$('tp'),rD=$('rD'),rV=$('rV'),arm=$('arm'),ctr=$('ctr'),nl=$('vl').firstElementChild,nr=$('vr').firstElementChild;
let la=0,ra=0,sp=0,vu=0,last=performance.now();const buf=new Uint8Array(512);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const d=A.duration;
if((mode==='ff'||mode==='rew')&&A.getAttribute('src')&&isFinite(d)){A.currentTime=Math.max(0,A.currentTime+(mode==='ff'?7:-9)*dt);
if(mode==='rew'&&A.currentTime<=0)setMode('pause');else if(mode==='ff'&&A.currentTime>=d-.3){setMode('stop');step(1)}}
const p=isFinite(d)&&d?A.currentTime/d:0;
sp+=((({play:1,ff:5,rew:-5})[mode]||0)-sp)*Math.min(1,dt*6);const spd=drag?0:sp;
if(th==='cas'){const r1=31-15*p,r2=16+15*p;la+=spd*dt*4000/r1;ra+=spd*dt*4000/r2;
rL.setAttribute('transform',`rotate(${la%360})`);rR.setAttribute('transform',`rotate(${ra%360})`);pL.setAttribute('r',r1);pR.setAttribute('r',r2);tp.setAttribute('d',`M120 ${146+r1}L150 194H210L240 ${146+r2}`)}
else if(th==='cd'){da+=spd*dt*(520-260*p);rD.setAttribute('transform',`rotate(${da%360} 180 115)`)}
else{va+=spd*dt*200;rV.setAttribute('transform',`rotate(${va%360} 130 115)`);if(!armDrag)armA+=((mode==='stop'?0:40+16*p)-armA)*Math.min(1,dt*3);arm.setAttribute('transform',`rotate(${armA.toFixed(2)} 318 35)`);
if(retro&&ctx&&mode==='play'&&Math.random()<dt*2.2)pop()}
const t=fmt(A.currentTime);if(ctr.textContent!==t)ctr.textContent=t;
drawBar(p,dt);
let lv=0;if(an&&mode==='play'){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}lv=Math.min(1,Math.sqrt(s/buf.length)*3.5)}
vu+=(lv-vu)*(lv>vu?.4:.12);
nl.style.transform=`rotate(${-50+100*vu}deg)`;nr.style.transform=`rotate(${-50+100*Math.min(1,vu*(.9+.1*Math.sin(now/530)))}deg)`;
if(mode==='play')A.playbackRate=1+(retro?TH[th].wow:0)*(Math.sin(now/310)+.5*Math.sin(now/97));
requestAnimationFrame(frame)}

/* ---------- start ---------- */
(async()=>{$('sort').value=sortM;$('retro').classList.toggle('on',retro);markSet();$('vol').value=vol;$('shuf').classList.toggle('on',shuf);$('rep').textContent=['repeat off','repeat all','repeat one'][rep];$('rep').classList.toggle('on',rep>0);
$('scan').hidden=!NAT();
try{db=await Promise.race([openDB(),wait(2500).then(()=>{throw 0})]);added=(await tx('readonly',s=>s.getAll())||[]).map(r=>(r.key='a'+r.id,r))}catch(e){db=null;added=[]}
setTheme(ls.get('th')||'cas');lidDims();sizeBar();requestAnimationFrame(frame);
rebuild();initVol();
if(NAT())await scanDevice();
rebuild();await go(0,false,true)})();
</script></body></html>
